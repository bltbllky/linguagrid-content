name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
      - name: Cache the OpenTaal wordlist
        uses: actions/cache@v4
        with:
          path: .cache/b1/wordlist.txt
          key: opentaal-wordlist-v1
      - name: Fetch the OpenTaal wordlist
        run: |
          mkdir -p .cache/b1
          test -s .cache/b1/wordlist.txt || curl -fsSL -o .cache/b1/wordlist.txt https://raw.githubusercontent.com/OpenTaal/opentaal-wordlist/master/wordlist.txt
          test -s .cache/b1/wordlist.txt
          wc -l .cache/b1/wordlist.txt
      - name: Validate stage b1
        run: |
          set -o pipefail
          npx tsx scripts/cli/validate.ts --stage b1 | tee stage-b1.log
          grep -qF "B1 stage is valid" stage-b1.log
      - name: Validate stage a1a2
        run: |
          set -o pipefail
          npx tsx scripts/cli/validate.ts --stage a1a2 | tee stage-a1a2.log
          grep -qF "A1A2 stage is valid" stage-a1a2.log
      - name: Validate stage b2
        run: |
          set -o pipefail
          npx tsx scripts/cli/validate.ts --stage b2 | tee stage-b2.log
          grep -qF "B2 stage is valid" stage-b2.log
      - name: Validate stage sentences
        run: |
          set -o pipefail
          npx tsx scripts/cli/validate.ts --stage sentences | tee stage-sentences.log
          grep -qF "Sentences stage is valid" stage-sentences.log
